name: Nesine keşif (elle çalıştır)

on:
  workflow_dispatch:     # sadece elle başlatılır, zamanlanmış değildir

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install playwright
      - run: playwright install --with-deps chromium
      - run: python probe_nesine.py
