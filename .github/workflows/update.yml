name: Günlük güncelleme

on:
  schedule:
    # 4 saatte bir: 00:00, 04:00, 08:00, 12:00, 16:00, 20:00 UTC = Türkiye saatiyle 03:00, 07:00, 11:00, 15:00, 19:00, 23:00.
    # GitHub yoğunlukta birkaç dakika geciktirebilir. Nesine bir denemede bağlantıyı kabul etmezse başarısız çalışma
    # siteyi değiştirmez, 4 saat sonra yeniden denenir.
    - cron: "0 */4 * * *"
  workflow_dispatch:       # elle de çalıştırılabilir

permissions:
  contents: write      # kupon kaydını (data/kupon_gecmisi.json) depoya yazmak için
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Veri sunucusu bazen yanıt vermiyor; önceki çalışmadan kalan kopyalar yedek olarak kullanılır.
      - uses: actions/cache@v4
        with:
          path: data/*.csv
          key: fd-${{ github.run_id }}
          restore-keys: fd-
      - run: python bot.py update

      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-v1
      # Nesine bülteni (tek oran/maç kaynağı). Başarısız olursa site eski haliyle kalır, yabancı kaynağa dönülmez.
      - name: Nesine oranlarını oku
        continue-on-error: true
        timeout-minutes: 20
        run: |
          pip install playwright
          # Playwright'ın indirme sunucusu (cdn.playwright.dev) bazen sertifika hatası veriyor: yeniden denenir
          for i in 1 2 3 4; do playwright install --with-deps chromium && break || (echo "tarayıcı indirme $i. deneme başarısız"; sleep 45); done
          python nesine.py fetch || (echo 'ilk deneme başarısız, 60 sn sonra tekrar' && sleep 60 && python nesine.py fetch)

      # GitHub'ın sunucusundan Nesine'ye erişilemezse: kullanıcının kendi tarayıcısından indirip depoya yüklediği
      # data/nesine_ham.json kullanılır (en fazla 36 saatlik veri kabul edilir).
      - name: Yedek - elle yüklenen Nesine verisi
        if: hashFiles('data/nesine.json') == ''
        continue-on-error: true
        run: |
          if [ -f data/nesine_ham.json ]; then python nesine.py import data/nesine_ham.json; else echo "data/nesine_ham.json yok"; fi

      - name: Testler
        continue-on-error: true
        run: |
          pip install pytest
          python -m pytest -q tests

      - run: python bot.py site --days 4 --out site/index.html
      # Bugünün kuponlarını kaydet; yarın "dünün kuponları" bölümü bundan okunur.
      - name: Kupon kaydını depoya yaz
        continue-on-error: true
        run: |
          git config user.name "gol-radar-bot"
          git config user.email "gol-radar-bot@users.noreply.github.com"
          if [ -f data/kupon_gecmisi.json ]; then
            git add data/kupon_gecmisi.json
            [ -f data/oran_gecmisi.jsonl ] && git add data/oran_gecmisi.jsonl
            [ -f data/pazar_adlari.json ] && git add data/pazar_adlari.json
            [ -f data/nesine_sonuc.json ] && git add data/nesine_sonuc.json
            [ -f data/skor_yedek.json ] && git add data/skor_yedek.json
            git diff --cached --quiet || (git commit -m "Kupon kaydı güncellendi" && for i in 1 2 3; do git pull --rebase --autostash && git push && break || sleep 5; done)
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
