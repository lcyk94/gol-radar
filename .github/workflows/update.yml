name: Günlük güncelleme

on:
  schedule:
    - cron: "0 5 * * *"   # her gün 05:00 UTC = Türkiye saatiyle 08:00
    # Nesine bazen GitHub sunucusunun bağlantısını kabul etmiyor; farklı sunucu/zamanla tekrar denenir.
    # Başarısız çalışma siteyi değiştirmez; başarılı olan siteyi günceller.
    - cron: "40 5 * * *"
    - cron: "20 6 * * *"
    - cron: "0 8 * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:       # elle de çalıştırılabilir

permissions:
  contents: write      # kupon kaydını (data/kupon_gecmisi.json) depoya yazmak için
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Veri sunucusu bazen yanıt vermiyor; önceki çalışmadan kalan kopyalar yedek olarak kullanılır.
      - uses: actions/cache@v4
        with:
          path: data/*.csv
          key: fd-${{ github.run_id }}
          restore-keys: fd-
      - run: python bot.py update

      # Nesine bülteni (tek oran/maç kaynağı). Başarısız olursa site eski haliyle kalır, yabancı kaynağa dönülmez.
      - name: Nesine oranlarını oku
        continue-on-error: true
        timeout-minutes: 10
        run: |
          pip install playwright
          playwright install --with-deps chromium
          python nesine.py fetch || (echo 'ilk deneme başarısız, 60 sn sonra tekrar' && sleep 60 && python nesine.py fetch)

      - name: Testler
        continue-on-error: true
        run: |
          pip install pytest
          python -m pytest -q tests

      - run: python bot.py site --days 4 --out site/index.html
      # Bugünün kuponlarını kaydet; yarın "dünün kuponları" bölümü bundan okunur.
      - name: Kupon kaydını depoya yaz
        continue-on-error: true
        run: |
          git config user.name "gol-radar-bot"
          git config user.email "gol-radar-bot@users.noreply.github.com"
          if [ -f data/kupon_gecmisi.json ]; then
            git add data/kupon_gecmisi.json
            [ -f data/oran_gecmisi.jsonl ] && git add data/oran_gecmisi.jsonl
            [ -f data/pazar_adlari.json ] && git add data/pazar_adlari.json
            [ -f data/nesine_sonuc.json ] && git add data/nesine_sonuc.json
            git diff --cached --quiet || (git commit -m "Kupon kaydı güncellendi" && git push)
          fi

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
